panel:
  password: "改我"
  port: 8790
anymail:
  api_key: ""
  base_url: ""
  domain: ""
  expires_hours: 0  # 0=永久（默认）；正数=限时小时数，到期邮箱被 AnyMail 清理
register:
  login_timeout: 120
  auto_login: true
  code_regex: ""
takeover:
  enabled: true          # 是否允许 Selkies 网页免密接管（需通过 HTTPS 打开面板）
  idle_timeout_min: 15   # 接管页关闭/断网多少分钟后自动结束
android:
  idle_timeout_min: 30   # Android 模拟器画面页关闭多少分钟后自动停止（0 = 不自动停止）
api:
  enabled: false         # 开放 API（/api/v1/*）总开关
  key: ""                # 在面板「设置 → 开放 API」生成；调用时放在 Authorization: Bearer <key>
oauth:
  auto_after_register: false  # 注册拿到 sessionKey 后自动换取 Claude OAuth 令牌
sub2api:
  base_url: ""   # 如 http://sub2api.syixn.com:8080，用于「sub2api 同步」页重新授权并写回
  admin_key: ""  # sub2api 管理员 API Key（sub2api 后台 → 系统设置生成）
