services:
  account-manager:
    image: ghcr.io/yiranxiaohui/account-manager:latest
    restart: unless-stopped
    ports: ["8790:8790"]   # 默认 HTTPS（自签证书存放在 data/tls/），见 README「Web 面板部署」
    # environment:
    #   PANEL_TLS: "off"     # 已由外层反代终结 HTTPS 时改回明文 HTTP
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
