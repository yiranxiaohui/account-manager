<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Account Manager Android</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      body {
        overflow: hidden; background: #0f1016; color: #f4f4f8;
        font-family: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      }
      iframe { display: block; }
      #notice {
        position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
        padding: 16px; background: rgba(10, 11, 16, .82); backdrop-filter: blur(8px); text-align: center;
      }
      #notice.visible { display: grid; }
      #notice > div {
        max-width: 440px; padding: 28px 32px; border-radius: 16px;
        background: #1a1b23; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 24px 48px rgba(0, 0, 0, .45);
      }
      #message { font-size: 15px; font-weight: 600; }
      #detail { margin-top: 8px; font-size: 13px; line-height: 1.6; color: rgba(244, 244, 248, .7); }
      #detail:empty { display: none; }
      #booting {
        position: fixed; top: 12px; left: 50%; z-index: 5; display: none; transform: translateX(-50%);
        padding: 6px 14px; border-radius: 999px; font-size: 13px; pointer-events: none;
        background: rgba(26, 27, 35, .9); box-shadow: 0 0 0 1px rgba(255, 255, 255, .08);
      }
      #booting.visible { display: block; }
      button {
        margin-top: 18px; padding: 8px 18px; border: 0; border-radius: 8px;
        background: #6d5df5; color: #fff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
        transition: background .15s;
      }
      button:hover { background: #5b4ae6; }
      button:focus-visible { outline: 2px solid rgba(109, 93, 245, .6); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <!-- Selkies 网页客户端推送模拟器所在的虚拟屏；本页只负责心跳、开机进度和结束提示。
         鼠标左键即触摸，右侧工具栏有返回/主页/旋转等按键；中文可先在本机复制，
         再在模拟器里长按输入框粘贴（剪贴板双向同步）。 -->
    <iframe
      id="viewer"
      title="Android 模拟器画面"
      allow="clipboard-read; clipboard-write; fullscreen; keyboard-map; autoplay"
      allowfullscreen
    ></iframe>
    <div id="booting" role="status">Android 系统启动中…</div>
    <div id="notice" role="alert">
      <div>
        <div id="message">Android 模拟器已停止</div>
        <div id="detail"></div>
        <button id="reload" type="button">重新加载</button>
      </div>
    </div>
    <script>
      const notice = document.getElementById("notice");
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");
      const booting = document.getElementById("booting");
      const viewer = document.getElementById("viewer");
      let heartbeatTimer;
      let statusTimer;

      function showNotice(text, extra = "", canReload = true) {
        message.textContent = text;
        detail.textContent = extra;
        document.getElementById("reload").style.display = canReload ? "" : "none";
        notice.classList.add("visible");
        booting.classList.remove("visible");
      }

      function end(text, extra = "") {
        showNotice(text, extra);
        clearInterval(heartbeatTimer);
        clearInterval(statusTimer);
        viewer.removeAttribute("src");
      }

      document.getElementById("reload").addEventListener("click", () => {
        window.location.reload();
      });

      async function heartbeat() {
        try {
          const response = await fetch("/api/android/heartbeat", {
            method: "POST",
            credentials: "same-origin",
          });
          if (response.ok) return true;
          if (response.status === 401) end("面板登录已失效，请重新登录");
          else if (response.status === 409) end("Android 模拟器已停止");
        } catch {
          // 短暂网络中断不立即终止；下一轮心跳会自动重试。
        }
        return false;
      }

      function loadViewer() {
        if (viewer.getAttribute("src")) return;
        viewer.src = "/android-vnc/";
        viewer.addEventListener("load", () => viewer.focus(), { once: true });
      }

      async function refreshStatus() {
        try {
          const response = await fetch("/api/android", { credentials: "same-origin" });
          if (!response.ok) return;
          const s = await response.json();
          if (!s.running) {
            end("Android 模拟器已停止", s.last_error || "");
            return;
          }
          document.title = `Android · ${s.email}`;
          booting.textContent = s.phase === "starting" ? "正在准备模拟器…" : "Android 系统启动中…";
          booting.classList.toggle("visible", s.phase !== "running");
          // 「正在准备」阶段推流服务还没起来，过早加载只会停在 502 页上。
          if (s.phase !== "starting") loadViewer();
        } catch {
          /* 下一轮再试 */
        }
      }

      // Selkies 用浏览器的 WebCodecs 解码视频，浏览器只在 HTTPS（安全上下文）下提供它。
      if (!window.isSecureContext) {
        showNotice(
          "模拟器画面需要通过 HTTPS 打开",
          "请用 https:// 地址访问面板。容器默认以 HTTPS 提供面板（首次访问需在浏览器里确认自签证书）；"
            + "如果设置了 PANEL_TLS=off，请在外层反向代理上启用 HTTPS。",
          false,
        );
      } else {
        heartbeat().then(() => {
          if (!notice.classList.contains("visible")) refreshStatus();
        });
        heartbeatTimer = setInterval(heartbeat, 20_000);
        statusTimer = setInterval(refreshStatus, 2_000);
        window.addEventListener("online", heartbeat);
      }
    </script>
  </body>
</html>
