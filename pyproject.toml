[project]
name = "account-manager"
version = "0.3.5"
description = "Open Claude login with AnyMail auto-fill"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "playwright>=1.61.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "curl-cffi>=0.13",
    "python-xlib>=0.33",
]

[project.scripts]
account-manager = "account_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["account_manager"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
